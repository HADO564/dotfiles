# AeroSpace — Hyprland-style tiling for macOS
# Docs: https://nikitabobko.github.io/AeroSpace/guide
#
# Modifier scheme (chosen to avoid conflicts):
#   alt        workspaces, layout, launch      (Hyprland: Super)
#   ctrl-alt   focus / move windows            (alt-hjkl would steal LazyVim's Alt+j/k,
#                                                alt-arrows would steal macOS word-jump)
#   alt-tab    left unbound so an app switcher (AltTab) can use it

config-version = 2

start-at-login = true
auto-reload-config = true

# Active-window border, Catppuccin Mocha blue like the tmux bar
after-startup-command = [
  'exec-and-forget /opt/homebrew/bin/borders active_color=0xff89b4fa inactive_color=0x00000000 width=5.0',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'

# Hyprland used gaps_in = 4, gaps_out = 4
gaps.inner.horizontal = 8
gaps.inner.vertical =   8
gaps.outer.left =       8
gaps.outer.bottom =     8
gaps.outer.top =        8
gaps.outer.right =      8

[mode.main.binding]
    # ── Launch ────────────────────────────────────────────────────────────────
    alt-enter = 'exec-and-forget open -na /Applications/WezTerm.app'   # Super+Q

    # ── Layout ────────────────────────────────────────────────────────────────
    alt-f       = 'layout floating tiling'               # Super+F toggle float
    alt-shift-f = 'fullscreen'
    alt-slash   = 'layout tiles horizontal vertical'     # Super+J toggle split
    alt-comma   = 'layout accordion horizontal vertical'

    # ── Focus (Super+arrows) ──────────────────────────────────────────────────
    ctrl-alt-h = 'focus left'
    ctrl-alt-j = 'focus down'
    ctrl-alt-k = 'focus up'
    ctrl-alt-l = 'focus right'
    ctrl-alt-left  = 'focus left'
    ctrl-alt-down  = 'focus down'
    ctrl-alt-up    = 'focus up'
    ctrl-alt-right = 'focus right'

    # ── Move window ───────────────────────────────────────────────────────────
    ctrl-alt-shift-h = 'move left'
    ctrl-alt-shift-j = 'move down'
    ctrl-alt-shift-k = 'move up'
    ctrl-alt-shift-l = 'move right'
    ctrl-alt-shift-left  = 'move left'
    ctrl-alt-shift-down  = 'move down'
    ctrl-alt-shift-up    = 'move up'
    ctrl-alt-shift-right = 'move right'

    # ── Resize (Super+Alt+arrows) ─────────────────────────────────────────────
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # ── Workspaces (Super+1..9) ───────────────────────────────────────────────
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    # Move window to workspace and follow it (Super+Shift+1..9)
    alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
    alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
    alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
    alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
    alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
    alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
    alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
    alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
    alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'

    # Scratchpad (Super+S / Super+Shift+S)
    alt-s       = 'workspace S'
    alt-shift-s = 'move-node-to-workspace S'

    # ── Service mode: reload, reset layout, join windows ──────────────────────
    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']            # reset layout
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

# ── Window rules (Hyprland floated Thunar, settings dialogs, etc.) ────────────
[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.systempreferences'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.ActivityMonitor'
    run = 'layout floating'
