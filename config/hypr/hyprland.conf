
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


source = /home/hadoki/.config/hypr/colors.conf

################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = vicinae


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = swww-daemon
exec-once = vicinae server
exec-once = nm-applet &
exec-once = ~/.config/hypr/scripts/wallpaper.sh
# exec-once = swaync   # disabled: stole org.freedesktop.Notifications from quickshell NotificationServer
exec-once = hypridle
exec-once = gammastep-indicator
exec-once = playerctld
exec-once = swayosd-server
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.config/hypr/scripts/settings_watcher.sh &
exec-once = ~/.config/hypr/scripts/volume_listener.sh
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Adwaita'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = ~/.config/hypr/scripts/wal_apply.sh
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/Main.qml
exec-once = quickshell -p ~/.config/hypr/scripts/quickshell/TopBar.qml

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

# Without this, qt6ct is never consulted and Qt apps fall back to the stock
# unstyled look - that is what made Qt context menus plain. qt6ct itself picks
# the style and stylesheet, so do not also set QT_STYLE_OVERRIDE here.
env = QT_QPA_PLATFORMTHEME,qt6ct
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24
env = PATH,$PATH:/home/hadoki/.local/bin
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

cursor {
    no_hardware_cursors = true
}


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 4

    border_size = 2

    col.active_border = $active_border
    col.inactive_border = $inactive_border

    resize_on_border = true
    extend_border_grab_area = 30

    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 4

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows,               1, 5, myBezier, popin 80%
    animation = windowsOut,            1, 5, myBezier, popin 80%
    animation = layers,                1, 5, myBezier, fade
    animation = layersIn,              1, 5, myBezier, fade
    animation = layersOut,             1, 5, myBezier, fade
    animation = fade,                  1, 5, myBezier
    animation = workspaces,            1, 5, myBezier, slide
    animation = specialWorkspaceIn,    1, 5, myBezier, fade
    animation = specialWorkspaceOut,   1, 5, myBezier, fade
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = false
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    font_family = JetBrains Mono
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, B, exec, zen-browser
bind = $mainMod, C, exec, code
bind = $mainMod, X, killactive,
bind = $mainMod SHIFT ALT, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating,
bind = $mainMod, R, exec, vicinae toggle
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
# Spotlight-style launcher (Alt + Space)
bind = ALT, Space, exec, vicinae toggle

# Clipboard history picker
bind = $mainMod, V, exec, clipboard-picker

# Screenshots (requires grimblast)
bind = , Print, exec, grimblast copy area
bind = SHIFT, Print, exec, grimblast copy screen
bind = $mainMod, Print, exec, grimblast save area ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png
bind = CTRL $mainMod, F, exec, grimblast copysave screen ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png
bind = CTRL $mainMod, S, exec, grimblast copysave area ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png

# Color picker
bind = $mainMod SHIFT, C, exec, hyprpicker -a

# Wallpaper picker
bind = $mainMod, W, exec, wallpaper-picker

# Waybar theme picker
bind = $mainMod, T, exec, waybar-theme-picker

# Lock screen
bind = $mainMod, L, exec, ~/.config/hypr/scripts/lock.sh

# Restore minimized windows
bind = $mainMod, M, exec, bash /home/hadoki/.config/hypr/scripts/restore-minimized.sh

# Keybindings cheat sheet
bind = $mainMod, F1, exec, kitty --class keybindings-cheatsheet --title "Keybindings" ~/.config/hypr/scripts/cheatsheet.sh
bind = $mainMod, I, exec, kitty --title "btop" btop

# Dev tools cheat sheet (tmux + nvim + CLI)
bind = $mainMod, F2, exec, kitty --class keybindings-cheatsheet --title "Dev Cheatsheet" sh -c "glow -p ~/.config/hypr/dev-cheatsheet.md"

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Resize active window with mainMod + ALT + arrow keys
binde = $mainMod ALT, right, resizeactive, 30 0
binde = $mainMod ALT, left, resizeactive, -30 0
binde = $mainMod ALT, up, resizeactive, 0 -30
binde = $mainMod ALT, down, resizeactive, 0 30

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

windowrule {
    name = kitty-active-opacity
    match:class = ^(kitty)$
    opacity = 0.9
}

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
    name = ignore-maximize-requests
    match:class = .*
    suppress_event = maximize
}


# Float utility windows
windowrule {
    name = float-pavucontrol
    match:class = ^(pavucontrol)$
    float = true
    size = 700 500
}

windowrule {
    name = float-thunar
    match:class = ^(thunar)$
    float = true
    size = 900 600
}

windowrule {
    name = float-file-pickers
    match:title = ^(Open File)
    float = true
}

windowrule {
    name = float-save-dialogs
    match:title = ^(Save File)
    float = true
}

windowrule {
    name = float-upload-dialogs
    match:title = ^(File Upload)
    float = true
}

windowrule {
    name = float-nm-editor
    match:class = ^(nm-connection-editor)$
    float = true
}

windowrule {
    name = float-keybindings-cheatsheet
    match:class = ^(keybindings-cheatsheet)$
    float = true
    size = 780 700
    center = true
}

windowrule {
    name = float-nwg-look
    match:class = ^(nwg-look)$
    float = true
}

# Rofi: float, center, and use popin animation
windowrule {
    name = float-rofi
    match:class = ^(Rofi)$
    float = true
    center = true
    animation = popin 80%
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true

    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}



