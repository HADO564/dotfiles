# ─── PREFIX ───────────────────────────────────────────────────────────────────
unbind C-b
unbind C-Space
unbind C-\\
set -g prefix C-a
bind C-a send-prefix

# ─── GENERAL ──────────────────────────────────────────────────────────────────
set -g mouse on
set -sg escape-time 0
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g focus-events on
set -g display-time 2000
set -g status-interval 5

# ─── TERMINAL COLORS ──────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ─── VIM KEYS IN COPY MODE ────────────────────────────────────────────────────
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel
# copy-pipe uses copy-command: pbcopy on macOS, wl-copy on Wayland
if-shell 'test "$(uname)" = Darwin' \
  'set -s copy-command pbcopy' \
  'set -s copy-command wl-copy'

# ─── SPLITS ───────────────────────────────────────────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ─── PANE NAVIGATION (vim-like) ───────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── PANE RESIZING ────────────────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── WINDOWS ──────────────────────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#{window_name}" "rename-window '%%'"
bind Tab last-window
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# ─── SESSIONS ─────────────────────────────────────────────────────────────────
bind f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind s choose-tree -Zs

# ─── RESURRECT (only if installed) ────────────────────────────────────────────
if-shell 'test -f ~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux' {
  run '~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux'
  bind C-s run '~/.local/share/tmux/plugins/tmux-resurrect/scripts/save.sh'
  bind C-r run '~/.local/share/tmux/plugins/tmux-resurrect/scripts/restore.sh'
}

# ─── CONFIG RELOAD ────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "  Config reloaded!"

# ─── STATUS BAR (Catppuccin Mocha palette) ────────────────────────────────────
set -g status-position top
set -g status-style                 bg=#1e1e2e,fg=#cdd6f4
set -g status-left-length           30
set -g status-right-length          60
set -g status-left                  "#[fg=#89b4fa,bold] #S  "
set -g status-right                 "#[fg=#a6e3a1] %H:%M  #[fg=#cdd6f4]%d %b "
set -g window-status-format         " #I:#W "
set -g window-status-current-format "#[bg=#89b4fa,fg=#1e1e2e,bold] #I:#W "
set -g window-status-separator      ""
set -g pane-border-style            fg=#313244
set -g pane-active-border-style     fg=#89b4fa
set -g message-style                bg=#313244,fg=#cdd6f4
